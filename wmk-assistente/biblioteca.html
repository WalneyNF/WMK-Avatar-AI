<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca e Qualidade — WMK Avatar AI</title><style>body{background:#0c1513;color:#e6faef;font:16px system-ui;max-width:950px;margin:30px auto;padding:15px}section{background:#15251f;border:1px solid #376449;padding:20px;margin:15px 0;border-radius:12px}h1,h2{color:#7af4aa}select,button{display:block;width:100%;padding:12px;margin:8px 0 18px;background:#102019;border:1px solid #417a57;border-radius:8px;color:#e8fff0;font:inherit}button{background:#286f4a;cursor:pointer}video{width:100%;max-height:450px}a{color:#8cf5bb}small{color:#a5c6b2}</style><h1>WMK Avatar AI — Biblioteca de Vídeos</h1><p><a href="/monitor">Monitor</a> · <a href="/manuais/qualidade-video.html">Manual de qualidade</a></p><section><h2>Escolha um MP4 já gerado</h2><button onclick="carregar()">Atualizar biblioteca</button><select id="video"></select><video id="player" controls></video><p id="info"></p></section><section><h2>Qualidade e exportação</h2><p><small>Não refaz a renderização neural. O vídeo original permanece intacto. Ampliar 256 px não cria detalhes faciais novos.</small></p><label>Resolução</label><select id="resolucao"><option value="original">Original</option><option value="480p">480p</option><option value="720p">720p</option><option value="1080p">1080p (ampliação)</option></select><label>Qualidade H.264 / CRF</label><select id="crf"><option>18</option><option selected>20</option><option>23</option><option>26</option><option>28</option></select><label>Velocidade de codificação</label><select id="preset"><option>ultrafast</option><option selected>fast</option><option>medium</option><option>slow</option></select><label>FPS de saída</label><select id="fps"><option>15</option><option selected>25</option><option>30</option></select><label>Nitidez</label><select id="nitidez"><option>desligada</option><option>suave</option><option>media</option></select><label>Áudio AAC (kbps)</label><select id="audio_kbps"><option>128</option><option selected>192</option><option>256</option></select><button id="exportar" onclick="exportar()">Exportar outra versão do MP4</button><p id="status"></p></section><footer>Walney Moreira Klein — walneyk@hotmail.com</footer><script>const el=id=>document.getElementById(id);async function carregar(){try{const r=await fetch('/api/videos');const d=await r.json();el('video').replaceChildren();d.videos.forEach(v=>el('video').add(new Option(v.arquivo+' ('+(v.bytes/1048576).toFixed(2)+' MB)',v.arquivo)));atualizar()}catch(e){el('status').textContent=e.message}}function atualizar(){const name=el('video').value;el('player').src=name?'/api/video-biblioteca/'+encodeURIComponent(name):'';el('info').textContent=name||'Nenhum vídeo encontrado.'}el('video').addEventListener('change',atualizar);async function exportar(){const name=el('video').value;if(!name){el('status').textContent='Selecione um vídeo.';return}el('exportar').disabled=true;el('status').textContent='Codificando vídeo, aguarde...';try{const qualidade={resolucao:el('resolucao').value,crf:Number(el('crf').value),preset:el('preset').value,fps:Number(el('fps').value),nitidez:el('nitidez').value,audio_kbps:Number(el('audio_kbps').value)};const r=await fetch('/api/videos/exportar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arquivo:name,qualidade})});const d=await r.json();if(!r.ok)throw Error(d.erro||'HTTP '+r.status);const a=document.createElement('a');a.href=d.url;a.download='wmk-qualidade.mp4';a.textContent='Baixar MP4 exportado';el('status').replaceChildren(a)}catch(e){el('status').textContent='Erro: '+e.message}finally{el('exportar').disabled=false}}carregar()</script></html>
